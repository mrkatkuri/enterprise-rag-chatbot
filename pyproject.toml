[project]
name = "enterprise-rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-pinecone>=0.9.0",
    "pinecone>=9.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[project.scripts]
enterprise-rag-chatbot = "enterprise_rag_chatbot:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
