<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1580" viewBox="0 0 1400 1580" role="img" aria-labelledby="title description">
<title id="title">Enterprise RAG Chatbot Architecture</title>
<desc id="description">Document ingestion creates Pinecone vectors and a local corpus snapshot. LangGraph resolves conversation questions, combines dense search and BM25, reranks evidence, generates claims, validates citations, and returns an answer or abstention. Evaluation stores answers and retrieved context for faithfulness review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
